<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}OEE{% endblock %} · Portal OEE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('portal.index') }}">OEE</a>
    <nav>
      {% if usuario %}
        <a href="{{ url_for('portal.calculadora') }}">Calculadora</a>
        <a href="{{ url_for('portal.perfil') }}">{{ usuario.nome or usuario.email }}</a>
        <a class="botao secundario" href="{{ url_for('auth.logout') }}">Sair</a>
      {% else %}
        <a class="botao" href="{{ url_for('auth.login') }}">Entrar com Microsoft</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
