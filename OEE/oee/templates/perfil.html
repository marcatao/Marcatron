{% extends "base.html" %}
{% block titulo %}Perfil{% endblock %}
{% block conteudo %}
<section class="cartao">
  <h1>Meu perfil</h1>
  <dl>
    <dt>Nome</dt><dd>{{ usuario.nome }}</dd>
    <dt>E-mail</dt><dd>{{ usuario.email }}</dd>
    <dt>ID do objeto (Entra ID)</dt><dd><code>{{ usuario.oid }}</code></dd>
    <dt>Locatário</dt><dd><code>{{ usuario.tid }}</code></dd>
  </dl>
</section>
{% endblock %}
