<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uhuu Rollers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wrap"><canvas id="game" width="960" height="540" aria-label="Uhuu Rollers — jogo de patins"></canvas></div>

<div id="top">
  <button id="bPause" type="button" aria-label="Pausar (P)" title="Pausar (P)"><svg viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/></svg></button>
  <button id="bMute" type="button" aria-label="Som (M)" title="Som (M)" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M1 5h3l4-3v10L4 9H1z"/><path id="snd" d="M10 4.5c1.2 1.4 1.2 3.6 0 5" stroke="currentColor" fill="none" stroke-width="1.4"/><path id="slash" d="M9.5 4l4 6M13.5 4l-4 6" stroke="currentColor" stroke-width="1.4" style="display:none"/></svg></button>
  <button id="bFull" type="button" aria-label="Tela cheia (F)" title="Tela cheia (F)"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
</div>

<div id="touch" hidden>
  <div id="pad" class="tbtn" aria-label="Direcional"><svg viewBox="0 0 26 26" fill="currentColor"><path d="M17 4L6 13l11 9z"/></svg><svg viewBox="0 0 26 26" fill="currentColor"><path d="M9 4l11 9-11 9z"/></svg></div>
  <div id="act" class="tbtn" aria-label="Powerslide">SLIDE</div>
  <div id="jump" class="tbtn" aria-label="Pular">PULAR</div>
</div>
<form id="nameBox" hidden autocomplete="off">
  <label for="nameIn">QUAL O NOME DO SEU PATINADOR?</label>
  <div class="row"><input id="nameIn" maxlength="16" spellcheck="false" autocapitalize="words" enterkeyhint="go" placeholder="Seu nome" aria-label="Nome do personagem"><button id="nameGo" type="submit">BORA! ▶</button></div>
</form>
<div id="rot" hidden><span>Gire o celular: o jogo é na horizontal.</span><button id="rotOk" type="button">OK</button></div>

<script src="js/01-constantes.js"></script>
<script src="js/02-utilidades.js"></script>
<script src="js/03-tela.js"></script>
<script src="js/04-entrada.js"></script>
<script src="js/05-audio.js"></script>
<script src="js/06-fase.js"></script>
<script src="js/07-pista.js"></script>
<script src="js/08-arte-base.js"></script>
<script src="js/09-heroi.js"></script>
<script src="js/10-inimigos.js"></script>
<script src="js/11-arte-inimigos.js"></script>
<script src="js/12-arte-chefe.js"></script>
<script src="js/13-arte-pista.js"></script>
<script src="js/14-merlin.js"></script>
<script src="js/15-cenario.js"></script>
<script src="js/16-jogo.js"></script>
<script src="js/17-ia-inimigos.js"></script>
<script src="js/18-chefe.js"></script>
<script src="js/19-treino.js"></script>
<script src="js/20-ladeira.js"></script>
<script src="js/21-ranking.js"></script>
<script src="js/22-render.js"></script>
</body>
</html>
