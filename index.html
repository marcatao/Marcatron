<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marcatron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Permanent+Marker&display=swap">
<style>
:root{
  /* Layout: uma tela de jogo em canvas HD (240 unidades de altura, resolução nativa); controles de toque sobrepostos */
  --bg:#07050d; --ink:#f2eefa; --dim:#9a93ad; --lime:#b6ff3b; --orange:#ff7a1a; --pink:#ff3fa4;
  --glass:rgba(18,14,30,.55); --line:rgba(255,255,255,.18);
  --pad:rgba(14,10,26,.14); --pad-on:rgba(182,255,59,.2); --pad-line:rgba(255,255,255,.2);
  --ui:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a1030 0%,var(--bg) 70%)}
canvas{display:block;background:#000}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:6}
#top button{width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#top button svg{width:15px;height:15px}
#top button:hover{border-color:rgba(182,255,59,.6)}
#top button:focus-visible,.tbtn:focus-visible,#rot button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#top button[aria-pressed="true"]{color:var(--orange)}
#touch[hidden],#rot[hidden]{display:none!important}
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--ui);letter-spacing:.08em;color:rgba(242,238,250,.62);background:var(--pad);border:2px solid var(--pad-line);text-shadow:0 1px 2px rgba(0,0,0,.55)}
.tbtn.on{background:var(--pad-on);border-color:rgba(182,255,59,.85);color:#f2eefa}
#pad{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:150px;height:68px;border-radius:34px;justify-content:space-between;padding:0 16px}
#pad svg{width:24px;height:24px;opacity:.5}
#pad.l svg:first-child,#pad.r svg:last-child{opacity:1;color:var(--lime)}
#jump{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%}
#act{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;color:rgba(255,154,80,.75)}
#act.on{background:rgba(255,122,26,.2);border-color:rgba(255,122,26,.85);color:#ffd2ad}
#rot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(116px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:12px;align-items:center;font:600 15px/1.35 var(--ui);color:var(--ink);background:rgba(18,14,30,.92);border:1px solid var(--orange);padding:10px 14px;border-radius:10px;width:max-content;max-width:calc(100% - 32px)}
#rot button{font:800 14px/1 var(--ui);color:#111;background:var(--lime);border:0;border-radius:6px;padding:8px 12px}
/* v8: nome do personagem, perguntado ao abrir o jogo */
#nameBox{position:fixed;z-index:8;left:max(16px,6vw);bottom:17%;display:flex;flex-direction:column;gap:8px;padding:12px 14px;max-width:calc(100% - 32px);background:rgba(18,12,30,.9);border:2px solid var(--lime);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#nameBox[hidden]{display:none!important}
#nameBox.top{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;left:50%;transform:translateX(-50%)}
#nameBox label{font:800 15px/1 var(--ui);letter-spacing:.06em;color:var(--lime)}
#nameBox .row{display:flex;gap:8px}
#nameIn{font:800 22px/1.1 var(--ui);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;width:min(280px,58vw);min-width:0;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#nameIn:focus{outline:2px solid var(--orange);outline-offset:1px}
#nameGo{font:800 18px/1 var(--ui);color:#160c02;background:var(--orange);border:0;border-radius:8px;padding:0 16px;cursor:pointer;touch-action:manipulation;white-space:nowrap;flex:none}
#nameGo:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>

<div id="wrap"><canvas id="game" width="960" height="540" aria-label="Marcatron — fase de teste jogável com Gabriel Rock"></canvas></div>

<div id="top">
  <button id="bPause" type="button" aria-label="Pausar (P)" title="Pausar (P)"><svg viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/></svg></button>
  <button id="bMute" type="button" aria-label="Som (M)" title="Som (M)" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M1 5h3l4-3v10L4 9H1z"/><path id="snd" d="M10 4.5c1.2 1.4 1.2 3.6 0 5" stroke="currentColor" fill="none" stroke-width="1.4"/><path id="slash" d="M9.5 4l4 6M13.5 4l-4 6" stroke="currentColor" stroke-width="1.4" style="display:none"/></svg></button>
  <button id="bFull" type="button" aria-label="Tela cheia (F)" title="Tela cheia (F)"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
</div>

<div id="touch" hidden>
  <div id="pad" class="tbtn" aria-label="Direcional"><svg viewBox="0 0 26 26" fill="currentColor"><path d="M17 4L6 13l11 9z"/></svg><svg viewBox="0 0 26 26" fill="currentColor"><path d="M9 4l11 9-11 9z"/></svg></div>
  <div id="act" class="tbtn" aria-label="Powerslide">SLIDE</div>
  <div id="jump" class="tbtn" aria-label="Pular">PULAR</div>
</div>
<form id="nameBox" hidden autocomplete="off">
  <label for="nameIn">QUAL O NOME DO SEU PATINADOR?</label>
  <div class="row"><input id="nameIn" maxlength="16" spellcheck="false" autocapitalize="words" enterkeyhint="go" placeholder="Gabriel Rock" aria-label="Nome do personagem"><button id="nameGo" type="submit">BORA! ▶</button></div>
</form>
<div id="rot" hidden><span>Gire o celular: o jogo é na horizontal.</span><button id="rotOk" type="button">OK</button></div>

<script>
(() => {
'use strict';
// =================================================================== constantes do mundo
const VHV = 114, BGH = 215, PX = BGH / VHV;   // altura visível do jogo (unidades; v4: ~15% mais zoom), altura visível das camadas de fundo, razão entre as escalas
const TS = 16, ROWS = 15, VH = 240, STAGE_C = 217, COLS = STAGE_C + 22, LW = COLS * TS, GOAL_C = STAGE_C + 6, GROUND_Y = 192;   // v6: arena do chefe antes do palco
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4;   // trilha "Pé na Porta" (v5): rock'n'roll em Lá
const HARM = ['A', 'A', 'A', 'A', 'D', 'D', 'A', 'E', 'G', 'D', 'A', 'A', 'G', 'D', 'E', 'E'];
const FONT_UI = '"Barlow Condensed", "Arial Narrow", sans-serif';
const FONT_HAND = '"Permanent Marker", "Comic Sans MS", cursive';
const OUT = '#140f1f';           // contorno dos personagens
const RED = '#ff2a4a';           // emissivo da IA

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const isTouch = COARSE || navigator.maxTouchPoints > 0;
let touchUI = COARSE;            // controles de toque visíveis (aparecem no primeiro toque, somem ao usar teclado)

// =================================================================== utilidades
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const REC_KEY = 'marcatron.recorde.1-1.v91';   // v9.1: o herói ficou 10% mais devagar, o recorde antigo não vale mais
const SCORE_KEY = 'marcatron.pontos.1-1';   // v8.1: melhor pontuação de manobras
// v8: o nome do personagem é perguntado ao abrir o jogo (o último fica salvo no aparelho e vem preenchido)
const NAME_KEY = 'marcatron.nome', NAME_DEF = 'Gabriel Rock';
const cleanName = s => String(s || '').replace(/[^\p{L}\p{N} ._'-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 16);
let heroName = cleanName(store.get(NAME_KEY)) || NAME_DEF;
const NAME_UP = () => heroName.toUpperCase();
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function vgrad(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function fillStroke(g, fill, lw = 0.7, stroke = OUT) { g.fillStyle = fill; g.fill(); if (lw > 0) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); } }

// =================================================================== tela, escala e qualidade
let W = 960, H = 540, K = 4, KB = 2.5, VW = 240, qScale = 1, cssW = 960, cssH = 540;
const caches = [];                // funções que reconstroem caches ao mudar a escala
function onRescale(fn) { caches.push(fn); }
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let vw = VHV * ww / wh, cw = ww, ch = wh;
  if (vw < 170) { vw = 170; ch = ww * VHV / 170; }
  if (vw > 400) { vw = 400; cw = wh * 400 / VHV; }
  const maxH = (COARSE ? 912 : 1197) * qScale;
  let bh = Math.min(ch * dpr, maxH);
  bh = Math.max(285, Math.round(bh / 57) * 57);      // múltiplo de 57 => blocos de 16 unidades com pixels inteiros (16·H/114)
  H = bh; K = H / VHV; KB = H / BGH; W = Math.round(vw * K); VW = W / K;
  cvs.width = W; cvs.height = H; cvs.style.width = Math.round(cw) + 'px'; cvs.style.height = Math.round(ch) + 'px';
  cssW = cw; cssH = ch;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  caches.forEach(fn => fn());
  const rot = document.getElementById('rot');
  if (rot) rot.hidden = !(isTouch && wh > ww && !rotDismissed);
}
let rotDismissed = false;
window.addEventListener('resize', () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 80); });
// queda de qualidade automática se o aparelho não sustentar ~50 fps
const perf = { acc: 0, n: 0, lastAdj: 0, skip: 120 };
function perfSample(dtMs, now) {
  if (window.__noAdapt || perf.skip > 0 || document.hidden || dtMs > 120) { perf.skip--; return; }
  perf.acc += dtMs; perf.n++;
  if (perf.n >= 120) {
    const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0;
    if (avg > 23 && qScale > 0.5 && now - perf.lastAdj > 2500) { qScale *= 0.82; perf.lastAdj = now; perf.skip = 60; resize(); }
  }
}

// =================================================================== entrada
const input = { left: false, right: false, jump: false, jumpP: false, actP: false, startP: false, any: false };
const keys = {}; let touchDir = 0, touchJump = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', KeyX: 'act', KeyJ: 'act', KeyK: 'act' };
window.addEventListener('keydown', e => {
  audioInit();
  if (e.target && e.target.tagName === 'INPUT') return;   // digitando o nome: o jogo não rouba as teclas
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter') e.preventDefault();
  if (e.repeat) return;
  if (k && !COARSE) setTouchUI(false);
  if (k) { keys[k] = true; if (k === 'jump') { input.jumpP = true; input.startP = true; } if (k === 'act') input.actP = true; }
  if (e.code === 'Enter') input.startP = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMuted(!AU.muted);
  if (e.code === 'KeyF') toggleFull();
  if (e.code === 'KeyR' && (G.state === 'play' || G.state === 'paused')) startGame();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchDir = 0; touchJump = false; });
function syncInput() { input.left = !!keys.left || touchDir < 0; input.right = !!keys.right || touchDir > 0; input.jump = !!keys.jump || touchJump; }

const touchEl = document.getElementById('touch'), pad = document.getElementById('pad'), bJump = document.getElementById('jump'), bAct = document.getElementById('act');
function setTouchUI(on) { if (touchUI === on) return; touchUI = on; touchEl.hidden = !on; }
touchEl.hidden = !touchUI;
window.addEventListener('touchstart', () => setTouchUI(true), { passive: true });
function padUpdate(e) { const r = pad.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2); touchDir = Math.abs(dx) < 8 ? 0 : Math.sign(dx); pad.classList.toggle('l', touchDir < 0); pad.classList.toggle('r', touchDir > 0); }
pad.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); try { pad.setPointerCapture(e.pointerId); } catch (_) {} padUpdate(e); });
pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture && pad.hasPointerCapture(e.pointerId)) padUpdate(e); });
const padEnd = () => { touchDir = 0; pad.classList.remove('l', 'r'); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => pad.addEventListener(ev, padEnd));
bJump.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); try { bJump.setPointerCapture(e.pointerId); } catch (_) {} touchJump = true; input.jumpP = true; input.startP = true; bJump.classList.add('on'); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => bJump.addEventListener(ev, () => { touchJump = false; bJump.classList.remove('on'); }));
bAct.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); input.actP = true; bAct.classList.add('on'); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => bAct.addEventListener(ev, () => bAct.classList.remove('on')));
['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => audioInit(), { passive: true }));
document.getElementById('wrap').addEventListener('pointerdown', () => { audioInit(); if ((G.state === 'title' && !nameAsking()) || G.state === 'results') input.startP = true; });
// ---------- caixa do nome (v8)
const nameBox = document.getElementById('nameBox'), nameIn = document.getElementById('nameIn');
const nameAsking = () => !nameBox.hidden;
function askName() {
  nameIn.value = store.get(NAME_KEY) ? heroName : ''; nameBox.hidden = false;
  if (!COARSE) setTimeout(() => { try { nameIn.focus({ preventScroll: true }); nameIn.select(); } catch (_) {} }, 60);
}
function confirmName() {
  heroName = cleanName(nameIn.value) || NAME_DEF; store.set(NAME_KEY, heroName);
  nameBox.hidden = true; nameBox.classList.remove('top'); try { nameIn.blur(); } catch (_) {}
  audioInit(); startGame();
}
nameBox.addEventListener('submit', e => { e.preventDefault(); confirmName(); });
nameIn.addEventListener('focus', () => { if (isTouch) nameBox.classList.add('top'); });
nameIn.addEventListener('blur', () => nameBox.classList.remove('top'));
['pointerdown', 'touchstart'].forEach(ev => nameBox.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
document.getElementById('bPause').addEventListener('click', e => { e.currentTarget.blur(); audioInit(); togglePause(); });
document.getElementById('bMute').addEventListener('click', e => { e.currentTarget.blur(); audioInit(); setMuted(!AU.muted); });
document.getElementById('bFull').addEventListener('click', e => { e.currentTarget.blur(); toggleFull(); });
document.getElementById('rotOk').addEventListener('click', () => { rotDismissed = true; document.getElementById('rot').hidden = true; });
function toggleFull() {
  try {
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} }).catch(() => {});
  } catch (_) {}
}

// =================================================================== áudio: trilha adaptativa em camadas + efeitos
const AU = {
  ctx: null, master: null, music: null, mfilter: null, sfx: null, buf: {}, gains: {}, srcs: {},
  t0: 0, started: false, muted: store.get('rcs.mudo') === '1', loaded: 0, total: 0, wantStart: false,
  danger: 0, crowd: 0.15, radio: 0, duck: 0, tick: 0, last: {}, loops: {},
};
const LOOP_PRE = 0.5, LOOP_LEN = 30.0;               // 16 compassos a 128 BPM
const LAYERS = ['calma', 'banda', 'pesada', 'plateia', 'radio'];
const LAYER_VOL = { calma: 0.95, banda: 0.9, pesada: 0.85, plateia: 0.75, radio: 0.8 };
const SFX_WAV = ['roll', 'grind', 'push', 'grind_start', 'powerslide', 'air', 'land_skate', 'strum_A', 'strum_D', 'strum_E', 'strum_G', 'pick', 'combo', 'jump0', 'jump1', 'jump2', 'land0', 'land1', 'skid', 'bump0', 'bump1', 'note_open', 'brick', 'stomp0', 'stomp1', 'stomp2', 'free', 'hurt', 'slam', 'antenna_hit', 'zap', 'item', 'click', 'pause', 'sticks', 'bark', 'alarm', 'dive', 'charge', 'armor', 'coo', 'meow', 'dizzy'];
const SFX_LATE = ['boss_roar', 'boss_throw', 'box_break', 'boss_tired', 'boss_hit', 'boss_clank', 'boss_step', 'gate'];   // v6: chefe (carregam depois)
const SFX_MP3 = ['ufo', 'beam', 'cheer', 'vitoria', 'morte', 'checkpoint', 'antena', 'powerup_varapau', 'powerup_marombado'];
const VARIANTS = { jump: ['jump0', 'jump1', 'jump2'], land: ['land0', 'land1'], stomp: ['stomp0', 'stomp1', 'stomp2'], bump: ['bump0', 'bump1'] };
const PENTA = [0, 2, 5, 7, 9, 12, 14, 17];            // escala de combo: pentatônica de Lá maior a partir do Mi da palheta

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended' && G.state !== 'paused') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  let c; try { c = AU.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return; }
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.22;
  comp.connect(c.destination);
  AU.master = c.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.95; AU.master.connect(comp);
  AU.music = c.createGain(); AU.music.gain.value = 0.85;
  AU.mfilter = c.createBiquadFilter(); AU.mfilter.type = 'lowpass'; AU.mfilter.frequency.value = 20000; AU.mfilter.Q.value = 0.5;
  AU.mfilter.connect(AU.music); AU.music.connect(AU.master);
  AU.sfx = c.createGain(); AU.sfx.gain.value = 0.9; AU.sfx.connect(AU.master);
  for (const L of LAYERS) { const g = c.createGain(); g.gain.value = 0; g.connect(AU.mfilter); AU.gains[L] = g; }
  loadAudio();
}
function decode(ab) {
  return new Promise((res, rej) => { try { const p = AU.ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); } catch (e) { rej(e); } });
}
async function loadOne(name, file) {
  try {

// --- projétil de estática (a IA atira "sinal")
function drawStatic(g, p) {

  g.strokeStyle = 'rgba(220,226,240,0.85)'; g.lineWidth = 0.6;

// =================================================================== arte dos inimigos robotizados (v4: mais detalhe e poses por estado)
// Todos desenhados virados para a esquerda (-x) com a origem no chão, no centro da hitbox; espelha quando olham para a direita.
const ES = 1.1;                                     // v5: arte dos inimigos 10% maior (hitboxes em DIM acompanham)
let WT = { k: 1, ox: 0, oy: 0 };                    // transformação do mundo (para emissivos de partes giradas)
function toWorld(g, x, y) { const m = g.getTransform(); return [(m.a * x + m.c * y + m.e - WT.ox) / WT.k, (m.b * x + m.d * y + m.f - WT.oy) / WT.k]; }
function emitL(g, x, y, r, col, a = 1) { const p = toWorld(g, x, y); emit(p[0], p[1], r, col, a); }
function groundBelow(x, y) { const c = Math.floor(x / TS); for (let r = Math.max(0, Math.floor(y / TS)); r < ROWS; r++) if (solidAt(c, r)) return r * TS; return null; }

const beatPulse = (beat, k = 3) => Math.max(0, 1 - (((beat % 1) + 1) % 1) * k);
function star(g, x, y, r, col) {
  g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = OUT; g.lineWidth = 0.25; g.stroke();
}
function thinLimb(g, pts, w, col) { // perna fina com contorno proporcional
  g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.strokeStyle = OUT; g.lineWidth = w + 0.5; g.stroke(); g.strokeStyle = col; g.lineWidth = w; g.stroke();
}
const PIG_AIR = { rise: 1, aim: 1, dive: 1, recover: 1, land: 1 };

// ------------------------------------------------------------------ Pombo-Antena "Pombix" (Eletrônico / Punk quando livre)
function drawPigeon(g, e, beat) {
  const free = e.freed, st = free ? 'free' : e.state, t = e.t, pulse = beatPulse(beat);
  const air = free ? e.flying : !!PIG_AIR[st];
  const cx = e.x + e.w / 2, by = e.y + e.h;
  const gy = groundBelow(cx, by - 1);
  if (gy != null && gy - by < 80) contactShadow(g, cx, gy, 5.6 * ES * (1 - (gy - by) / 120), 1 - (gy - by) / 80);
  g.save(); g.translate(cx, by); g.scale(ES, ES); if (e.dir > 0) g.scale(-1, 1);
  const fwd = e.vx * (e.dir > 0 ? 1 : -1);          // velocidade "para a frente" no referencial do desenho
  let rot = 0;
  if (st === 'dive') rot = clamp(Math.atan2(-e.vy, fwd), -1.25, 1.25);
  else if (st === 'alert') rot = -0.06 + Math.sin(e.st * 0.9) * 0.05;
  else if (st === 'dizzy') rot = Math.sin(e.st * 0.22) * 0.2;
  else if (free && e.flying) rot = -0.15;

function physBody(b, g = 0.3) {

  const r0 = Math.floor(b.y / TS), r1 = Math.floor((b.y + b.h - 0.01) / TS);
  if (b.vx !== 0) { const c = b.vx > 0 ? Math.floor((b.x + b.w - 0.01) / TS) : Math.floor(b.x / TS); for (let r = r0; r <= r1; r++) if (solidAt(c, r)) { b.x = b.vx > 0 ? c * TS - b.w : (c + 1) * TS; hitWall = true; break; } }
  if (ramps.length && rampBlock(b)) hitWall = true;   // v7: corpo das rampas é parede
  if (tut && tutBlock(b)) hitWall = true;              // v8: cerca e cancela do treino
  b.y += b.vy; b.onGround = false;
  const c0 = Math.floor(b.x / TS), c1 = Math.floor((b.x + b.w - 0.01) / TS);
  if (b.vy > 0) { const r = Math.floor((b.y + b.h - 0.01) / TS); for (let c = c0; c <= c1; c++) if (r >= 0 && solidAt(c, r)) { b.y = r * TS - b.h; b.vy = 0; b.onGround = true; break; } }
  else if (b.vy < 0) { const r = Math.floor(b.y / TS); for (let c = c0; c <= c1; c++) if (solidAt(c, r)) { b.y = (r + 1) * TS; b.vy = 0; break; } }
  return hitWall;
}

function ceilRoom(h, maxUp) {
  const c0 = Math.floor((h.x + 1) / TS), c1 = Math.floor((h.x + h.w - 1) / TS), feet = h.y + h.h;
  let room = maxUp;
  for (let c = c0; c <= c1; c++) for (let r = Math.floor((h.y - 0.01) / TS); r >= Math.floor((feet - maxUp) / TS); r--) if (solidAt(c, r)) { room = Math.min(room, feet - (r + 1) * TS); break; }
  return room;
}
